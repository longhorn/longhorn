name: Update Go Module

on:
  workflow_call:
    inputs:
      branch:
        description: "Base branch to update (e.g. master, v1.11.x)"
        required: true
        type: string
      package:
        description: "go.mod package to update (e.g. github.com/longhorn/go-common-libs)"
        required: true
        type: string
      version:
        description: "Target version, tag, branch or commit SHA (e.g. v1.2.3 or a commit hash)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      branch:
        description: "Base branch to update (e.g. master, v1.11.x)"
        required: true
        default: master
        type: string
      package:
        description: "go.mod package to update (e.g. github.com/longhorn/go-common-libs)"
        required: true
        type: string
      version:
        description: "Target version, tag, branch or commit SHA (e.g. v1.2.3 or a commit hash)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ inputs.branch }}
      GO_PACKAGE: ${{ inputs.package }}
      GO_VERSION_REF: ${{ inputs.version }}
    steps:
    - id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
      with:
        app-id: ${{ secrets.LONGHORN_GITHUB_BOT_APP_ID }}
        private-key: ${{ secrets.LONGHORN_GITHUB_BOT_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-pull-requests: write

    - name: Validate inputs
      run: |
        if [[ ! "${BASE_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
          echo "Invalid branch: ${BASE_BRANCH}"; exit 1
        fi
        if [[ ! "${GO_PACKAGE}" =~ ^[A-Za-z0-9._~/-]+$ ]]; then
          echo "Invalid package: ${GO_PACKAGE}"; exit 1
        fi
        if [[ ! "${GO_VERSION_REF}" =~ ^[A-Za-z0-9._+/-]+$ ]]; then
          echo "Invalid version: ${GO_VERSION_REF}"; exit 1
        fi

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.branch }}
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Update go.mod
      run: |
        if ! grep -qE "^\s*${GO_PACKAGE//./\\.}\s" go.mod; then
          echo "Package ${GO_PACKAGE} not found in go.mod"; exit 1
        fi
        go get "${GO_PACKAGE}@${GO_VERSION_REF}"
        go mod tidy
        go mod vendor

    - name: Check for changes
      run: |
        if [ -z "$(git status --porcelain)" ]; then
          echo "No changes after updating ${GO_PACKAGE}@${GO_VERSION_REF}"; exit 1
        fi

    - name: Create pull request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.app-token.outputs.token }}
        base: ${{ inputs.branch }}
        branch: update-go-module/${{ inputs.branch }}/${{ github.run_id }}
        sign-commits: true
        author: Longhorn GitHub Bot <67932897+longhorn-io-github-bot@users.noreply.github.com>
        committer: Longhorn GitHub Bot <67932897+longhorn-io-github-bot@users.noreply.github.com>
        commit-message: "chore(vendor): update dependencies"
        title: "chore(vendor): update dependencies"
        signoff: true
        delete-branch: true
        body: |
          #### What this PR does / why we need it:

          Update Go module `${{ inputs.package }}` to `${{ inputs.version }}` on `${{ inputs.branch }}`.

          Commands run:
          - `go get ${{ inputs.package }}@${{ inputs.version }}`
          - `go mod tidy`
          - `go mod vendor`

          Generated by the `Update Go Module` workflow.
