apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "longhorn.name" . }}
  namespace: {{ include "release_namespace" . }}
  labels:
    {{- include "longhorn.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "secrets", "services", "endpoints", "configmaps", "serviceaccounts", "persistentvolumeclaims", "persistentvolumeclaims/status"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments", "statefulsets", "replicasets"]
  verbs: ["*"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["*"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["*"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["*"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["*"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["*"]
---
# Namespace-scoped permissions for CSI sidecar leader election and
# CSIStorageCapacity owner-reference discovery.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-csi-role
  namespace: {{ include "release_namespace" . }}
  labels: {{- include "longhorn.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    # Lease creation cannot be restricted by resourceNames.
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames:
      - driver-longhorn-io
      - external-attacher-leader-driver-longhorn-io
      - external-resizer-driver-longhorn-io
      - external-snapshotter-leader-driver-longhorn-io
    verbs: ["get", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csistoragecapacities"]
    verbs: ["list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
---
# Lets the hook executor track SnapshotGroups and report hook progress in
# the Longhorn namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-hook-executor
  namespace: {{ include "release_namespace" . }}
  labels:
    {{- include "longhorn.labels" . | nindent 4 }}
rules:
- apiGroups: ["longhorn.io"]
  resources: ["snapshotgroups"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["longhorn.io"]
  resources: ["snapshotgroups/status"]
  verbs: ["update"]
- apiGroups: ["longhorn.io"]
  resources: ["volumes", "settings"]
  verbs: ["list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
