apiVersion: v1
kind: Service
metadata:
  labels: {{- include "longhorn.labels" . | nindent 4 }}
    app: longhorn-admission-webhook
  name: longhorn-admission-webhook
  namespace: {{ include "release_namespace" . }}
spec:
  type: ClusterIP
  {{- $admissionIPFamilyPolicy := include "longhorn.ipFamilyPolicy" . }}
  {{- if $admissionIPFamilyPolicy }}
  {{- $admissionIPFamilyPolicy | nindent 2 }}
  {{- end }}
  selector:
    longhorn.io/admission-webhook: longhorn-admission-webhook
  ports:
  - name: admission-webhook
    port: 9502
    targetPort: admission-wh
---
apiVersion: v1
kind: Service
metadata:
  labels: {{- include "longhorn.labels" . | nindent 4 }}
    app: longhorn-recovery-backend
  name: longhorn-recovery-backend
  namespace: {{ include "release_namespace" . }}
spec:
  type: ClusterIP
  {{- $recoveryIPFamilyPolicy := include "longhorn.ipFamilyPolicy" . }}
  {{- if $recoveryIPFamilyPolicy }}
  {{- $recoveryIPFamilyPolicy | nindent 2 }}
  {{- end }}
  selector:
    longhorn.io/recovery-backend: longhorn-recovery-backend
  ports:
  - name: recovery-backend
    port: 9503
    targetPort: recov-backend
