{{- if .Values.networkPolicies.restrictInternalTraffic }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: instance-manager
  namespace: {{ include "release_namespace" . }}
spec:
  podSelector:
    matchLabels:
      longhorn.io/component: instance-manager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: longhorn-manager
    - podSelector:
        matchLabels:
          longhorn.io/component: instance-manager
    - podSelector:
        matchLabels:
          longhorn.io/component: backing-image-manager
    - podSelector:
        matchLabels:
          longhorn.io/component: backing-image-data-source
  - ports:
    - protocol: TCP
      port: 3260
    {{- if .Values.networkPolicies.v1DataEngineInitiatorSourceCIDRs }}
    from:
      {{- range .Values.networkPolicies.v1DataEngineInitiatorSourceCIDRs }}
      - ipBlock:
          cidr: {{ . | quote }}
      {{- end }}
    {{- end }}
{{- end }}
