apiVersion: v1
name: longhorn
version: 1.12.2-rc1
appVersion: v1.12.2-rc1
kubeVersion: ">=1.25.0-0"
description: Longhorn is a distributed block storage system for Kubernetes.
keywords:
  - longhorn
  - storage
  - distributed
  - block
  - device
  - iscsi
  - nfs
home: https://github.com/longhorn/longhorn
sources:
  - https://github.com/longhorn/longhorn
  - https://github.com/longhorn/longhorn-engine
  - https://github.com/longhorn/longhorn-instance-manager
  - https://github.com/longhorn/longhorn-share-manager
  - https://github.com/longhorn/longhorn-manager
  - https://github.com/longhorn/longhorn-ui
  - https://github.com/longhorn/longhorn-tests
  - https://github.com/longhorn/backing-image-manager
maintainers:
  - name: Longhorn maintainers
    email: maintainers@longhorn.io
icon: https://raw.githubusercontent.com/cncf/artwork/master/projects/longhorn/icon/color/longhorn-icon-color.png
annotations:
  helm.sh/images: |-
    - name: longhorn-engine
      image: longhornio/longhorn-engine:v1.12.2-rc1
    - name: longhorn-manager
      image: longhornio/longhorn-manager:v1.12.2-rc1
    - name: longhorn-ui
      image: longhornio/longhorn-ui:v1.12.2-rc1
    - name: longhorn-instance-manager
      image: longhornio/longhorn-instance-manager:v1.12.2-rc1
    - name: longhorn-share-manager
      image: longhornio/longhorn-share-manager:v1.12.2-rc1
    - name: backing-image-manager
      image: longhornio/backing-image-manager:v1.12.2-rc1
    - name: support-bundle-kit
      image: longhornio/support-bundle-kit:v1.0.0
    - name: csi-attacher
      image: longhornio/csi-attacher:v4.13.0
    - name: csi-provisioner
      image: longhornio/csi-provisioner:v5.3.0
    - name: csi-node-driver-registrar
      image: longhornio/csi-node-driver-registrar:v2.18.0
    - name: csi-resizer
      image: longhornio/csi-resizer:v2.3.0
    - name: csi-snapshotter
      image: longhornio/csi-snapshotter:v8.7.0
    - name: livenessprobe
      image: longhornio/livenessprobe:v2.20.0
